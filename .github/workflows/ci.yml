name: CI (test + Sonar)

on:
  workflow_dispatch:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Sonar가 new code 판정에 git 히스토리를 쓴다

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # 테스트 프로파일(application-test.yml)이 localhost:6379, 비밀번호 redis1234를 기대한다
      - name: Start Redis
        run: docker run -d -p 6379:6379 redis:7 redis-server --requirepass redis1234

      - name: Test + coverage
        run: ./gradlew test jacocoTestReport --no-daemon

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test

      - name: Sonar
        if: env.SONAR_TOKEN != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./gradlew sonar --no-daemon
