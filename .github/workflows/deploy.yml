name: CI/CD for capstoneback

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      #      - name: Create application.yml from secrets
      #        run: |
      #          mkdir -p ./src/main/resources
      #          echo "${{ secrets.APPLICATION_YML }}" > ./src/main/resources/application.yml

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew clean build -x test
        working-directory: .

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build and push Spring image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/capstoneback .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/capstoneback

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: SSH to EC2 and Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          script: |
            cd /home/ubuntu/capstone
            
            echo "Creating .env file from GitHub Secrets..."
            echo "${{ secrets.ENV_VARS }}" > ./.env
  
  
  
            CURRENT=$(docker ps --format '{{.Names}}' | grep server-blue || true)
  
            if [ -z "$CURRENT" ]; then
            echo "현재 server-blue가 죽어있음 → blue 컨테이너 기동"
            docker compose up -d server-blue
            NEW_CONTAINER="blue"
            OLD_CONTAINER="green"
            sed -i 's/server capstone-server-green:8080;/server capstone-server-blue:8080;/' ./nginx/conf.d/default.conf
            HEALTH_URL="http://localhost:8080/actuator/health"
            else
            echo "현재 server-blue가 살아있음 → green 컨테이너 기동"
            docker compose up -d server-green
            NEW_CONTAINER="green"
            OLD_CONTAINER="blue"
            sed -i 's/server capstone-server-blue:8080;/server capstone-server-green:8080;/' ./nginx/conf.d/default.conf
            HEALTH_URL="http://localhost:8081/actuator/health"
            fi

#             헬스체크 대기 (최대 60초)
            echo "새 컨테이너 준비 대기..."
            READY=false
            for i in {1..12}; do
            if curl -s $HEALTH_URL | grep '"status":"UP"' > /dev/null; then
            READY=true
            echo "서버 준비 완료 ✅"
            break
            fi
            echo "서버 준비중... ($i)"
            sleep 5
            done
            
            if [ "$READY" != true ]; then
            echo "❌ 새 컨테이너 헬스체크 실패 → 롤백 시작"
            
            # nginx 설정 원복
            if [ "$NEW_CONTAINER" == "blue" ]; then
            sed -i 's/server capstone-server-blue:8080;/server capstone-server-green:8080;/' ./nginx/conf.d/default.conf
            else
            sed -i 's/server capstone-server-green:8080;/server capstone-server-blue:8080;/' ./nginx/conf.d/default.conf
            fi
            docker exec nginx-capstone nginx -s reload
          
            # 새 컨테이너 종료 및 제거
            docker compose rm -sf server-$NEW_CONTAINER
          
            echo "롤백 완료 → $OLD_CONTAINER 컨테이너로 서비스 유지"
            exit 1
            fi
            
            echo "✅ 새 컨테이너 정상 기동, Nginx reload"
            docker exec nginx-capstone nginx -s reload
            
            echo "구 컨테이너 종료 및 제거"
            docker compose rm -sf server-$OLD_CONTAINER
