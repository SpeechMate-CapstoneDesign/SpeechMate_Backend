services:
  server:
    image: s13121312/capstoneback:latest
    ports:
      - "8080:8080"
    depends_on:
      my-db:
        condition: service_healthy
      my-cache-server:
        condition: service_healthy
    restart: always
    env_file:
      - .env
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - TZ=Asia/Seoul
    command: java -Xms128m -Xmx256m -jar /app.jar  #JVM 시작 시 최소 128MB의 메모리를 확보하고 시작. JVM 최대 힙 메모리를 512MB로 제한
    # (참고) 만약 t2.small (2GB RAM) 이상으로 업그레이드한다면 아래와 같이 튜닝 가능
    # command: >
    #   java
    #   -Xms512m
    #   -Xmx1g
    #   -XX:MaxMetaspaceSize=256m
    #   -XX:+UseG1GC
    #   -Xlog:gc*:file=/app/logs/gc.log:tags,uptime,time,level
    #   -XX:+HeapDumpOnOutOfMemoryError
    #   -XX:HeapDumpPath=/app/logs/heapdump.hprof
    #   -jar /app.jar

    networks:
      - capstone-net

  nginx:
    image: nginx:latest
    container_name: nginx-capstone
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    restart: always
    networks:
      - capstone-net

  my-db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: capstone1234!
      MYSQL_DATABASE: capstonedb
    command: --innodb_buffer_pool_size=128M --max_connections=20  #메모리 사용량을 128MB로 제한 동시 연결 수를 줄임
    volumes:
      - ./mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always
    # 네트워크 할당
    networks:
      - capstone-net

  my-cache-server:
    image: redis:latest
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always
    networks:
      - capstone-net

# 사용할 네트워크
networks:
  capstone-net:
    driver: bridge