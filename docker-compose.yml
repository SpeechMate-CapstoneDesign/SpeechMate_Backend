version: '3.8'

services:
  server-blue:
    image: s13121312/capstoneback:latest
    container_name: capstone-server-blue
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - TZ=Asia/Seoul
    networks:
      - capstone-net
    restart: always
    depends_on:
      my-db:
        condition: service_healthy
      my-cache-server:
        condition: service_healthy

  server-green:
    image: s13121312/capstoneback:latest
    container_name: capstone-server-green
    ports:
      - "8081:8080"
    env_file:
      - .env
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - TZ=Asia/Seoul
    networks:
      - capstone-net
    restart: always
    depends_on:
      my-db:
        condition: service_healthy
      my-cache-server:
        condition: service_healthy


  nginx:
    image: nginx:latest
    container_name: nginx-capstone
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    restart: always
    networks:
      - capstone-net

  my-db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: capstone1234!
      MYSQL_DATABASE: capstonedb
    command: --innodb_buffer_pool_size=128M --max_connections=20  #메모리 사용량을 128MB로 제한 동시 연결 수를 줄임
    volumes:
      - ./mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always
    # 네트워크 할당
    networks:
      - capstone-net

  my-cache-server:
    image: redis:latest
    ports:
      - "6379:6379"
    env_file:
      - .env
    # appendonly: 재시작 시 스트림 PEL·refresh token 유실 방지 (AOF + 볼륨)
    command: [ "redis-server", "--requirepass", "${REDIS_PASSWORD}", "--maxmemory", "1gb", "--maxmemory-policy", "noeviction", "--appendonly", "yes" ]
    volumes:
      - ./redis_data:/data
    healthcheck:
      # 비밀번호 없이 ping하면 NOAUTH 응답도 exit 0이라 프로세스 생존만 확인하게 됨 → 인증 포함 + PONG 검증
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always
    networks:
      - capstone-net

  ai-worker:
    # container_name 없음 — 고정 이름이 있으면 replicas/--scale이 안 됨.
    # 스케일: AI_WORKER_REPLICAS=3 docker compose up -d ai-worker  (consumer 이름은 hostname 기반이라 자동으로 구분됨)
    image: s13121312/capstone-ai-worker:latest
    deploy:
      replicas: ${AI_WORKER_REPLICAS:-1}
    stop_grace_period: 120s   # SIGTERM 후 진행 중 분석을 끝낼 시간 (워커 SHUTDOWN_GRACE_S=110 보다 김)
    env_file:
      - .env # Redis 비밀번호 등 공유 환경 변수 로드
    environment:
      # [Redis Streams 설정] Service Name이 호스트 이름이 됨
      REDIS_HOST: my-cache-server
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD} # .env 파일에서 가져옴
      TZ: Asia/Seoul
    restart: always
    depends_on:
      my-cache-server: # Redis가 살아 있어야 작업을 시작할 수 있음
        condition: service_healthy
    networks:
      - capstone-net

# 사용할 네트워크
networks:
  capstone-net:
    driver: bridge