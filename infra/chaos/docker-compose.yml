name: chaos

# 비언어 분석 파이프라인 장애 주입 실험 스택.
# 실제 워커 코드(AI/main.py, AI/spring_callback.py)를 그대로 쓰고,
# 분석 함수만 "N초 걸리는 작업 / 특정 speechId에서 프로세스 크래시"로 바꾼다 (worker/nonverbal_analysis.py).
# Spring 대신 콜백을 받아 기록만 하는 sink를 둔다.

x-worker: &worker
  build: ./worker
  environment:
    REDIS_HOST: redis
    REDIS_PORT: 6379
    REDIS_PASSWORD: chaos
    RECLAIM_IDLE_MS: ${RECLAIM_IDLE_MS:-30000}      # 운영 기본 10분 → 실험은 30초
    SPRING_CALLBACK_URL: http://callback-sink:8080/api/callback/speech/non-verbal
    CALLBACK_SECRET: chaos-secret
    ANALYSIS_SLEEP: ${ANALYSIS_SLEEP:-20}             # 분석 1건 소요 시간(초)
    CRASH_SPEECH_ID: ${CRASH_SPEECH_ID:-666}          # 이 speechId를 처리하면 프로세스가 죽는다
    PYTHONUNBUFFERED: "1"
  volumes:
    - ../../AI/main.py:/app/main.py:ro
    - ../../AI/spring_callback.py:/app/spring_callback.py:ro
    - ./worker/nonverbal_analysis.py:/app/nonverbal_analysis.py:ro
  restart: always                                    # 운영 compose와 동일 — 크래시하면 도커가 되살린다
  stop_grace_period: 120s                            # 운영 compose와 동일 — docker stop 시 진행 중 작업을 끝낼 시간
  depends_on:
    redis:
      condition: service_healthy
    callback-sink:
      condition: service_started

services:
  redis:
    image: redis:7-alpine
    container_name: chaos-redis
    command: ["redis-server", "--requirepass", "chaos", "--appendonly", "yes"]
    ports:
      - "6389:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a chaos --no-auth-warning ping | grep PONG"]
      interval: 2s
      timeout: 2s
      retries: 15

  callback-sink:
    image: python:3.11-slim
    container_name: chaos-callback-sink
    command: ["python", "-u", "/app/callback_sink.py"]
    volumes:
      - ./callback_sink.py:/app/callback_sink.py:ro
      - ./data:/data

  worker-a:
    <<: *worker
    container_name: chaos-worker-a
    hostname: worker-a                               # consumer 이름 = analysis-consumer-worker-a

  worker-b:
    <<: *worker
    container_name: chaos-worker-b
    hostname: worker-b

  worker-c:                                          # 부하 테스트에서 3대 스케일 확인용 (기본은 안 띄움: profiles)
    <<: *worker
    container_name: chaos-worker-c
    hostname: worker-c
    profiles: ["load"]

  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    container_name: chaos-redis-exporter
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: chaos
      REDIS_EXPORTER_CHECK_SINGLE_STREAMS: nonverbal-analysis-jobs,nonverbal-analysis-dlq

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: chaos-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:11.3.0
    container_name: chaos-grafana
    ports:
      - "3002:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ../conf/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ../conf/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ../conf/grafana/dashboards:/var/lib/grafana/dashboards:ro
