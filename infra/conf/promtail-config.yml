server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker-logs
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # 컨테이너 이름 라벨 추가 (앞에 '/' 붙는 거 제거)
      - source_labels: ['__meta_docker_container_name']
        target_label: container
        regex: '/(.*)'
        replacement: '${1}'

      # 이미지 이름 라벨 추가
      - source_labels: ['__meta_docker_image']
        target_label: image

      # 컨테이너 ID 라벨 추가
      - source_labels: ['__meta_docker_container_id']
        target_label: container_id

    pipeline_stages:
      # 로그 줄 단위에서 타임스탬프 파싱 시도 (Spring 로그에 시간 포함될 경우 유용)
      - regex:
          expression: '^(?P<ts>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}.\d+) (?P<level>[A-Z]+) (?P<msg>.*)'
      - labels:
          level:
      - timestamp:
          source: ts
          format: '2006-01-02 15:04:05.000'
