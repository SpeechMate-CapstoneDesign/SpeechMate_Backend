name: monitoring

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
#      - /home/ubuntu/capstone/conf/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./conf/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - capstone-net
    restart: always

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      # 데이터소스·대시보드 자동 등록 (하위 폴더만 마운트 — plugins/alerting 미존재 에러 로그 방지)
      - ./conf/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./conf/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./conf/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - capstone-net
    restart: always
    depends_on:
      - prometheus

#  loki:
#    image: grafana/loki:latest
#    container_name: loki
#    command: -config.file=/mnt/config/config.yml
#    volumes:
#      - /home/ubuntu/capstone/conf/loki-config.yml:/mnt/config/config.yml:ro
#    ports:
#      - "3100:3100"
#    networks:
#      - capstone-net
#    restart: always
#
#  promtail:
#    container_name: promtail
#    image: grafana/promtail:latest
#    command: -config.file=/etc/promtail/config.yml
#    volumes:
#      - /home/ubuntu/capstone/conf/promtail-config.yml:/etc/promtail/config.yml
#      - /var/lib/docker/containers:/var/lib/docker/containers:ro
#      - /var/run/docker.sock:/var/run/docker.sock
#    networks:
#      - capstone-net
#    restart: always
#    depends_on:
#      - loki

  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: redis-exporter
    environment:
      - REDIS_ADDR=redis://host.docker.internal:6379
      - REDIS_PASSWORD=redis1234
      # 비언어 분석 작업 큐·DLQ의 길이/pending/consumer idle을 redis_stream_* 메트릭으로 노출
      - REDIS_EXPORTER_CHECK_SINGLE_STREAMS=nonverbal-analysis-jobs,nonverbal-analysis-dlq
    ports:
      - "9121:9121"
    networks:
      - capstone-net
    restart: always

networks:
  capstone-net:
    external: true
    name: capstone_capstone-net  # 기본적으로 파일이름_우리가 정한 네트워크이름 이렇게 네트워크이름이 정해져버림.

volumes:
  grafana-data: