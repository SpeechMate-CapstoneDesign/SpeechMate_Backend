server {
    listen 80;
    server_name speechmate.site;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# upstream 블록: 여기서 blue/green 전환
upstream backend {
    # 배포 스크립트에서 이 라인을 sed로 교체
    server capstone-server-blue:8080;
    # server capstone-server-green:8080;
}

server {
    listen 443 ssl;
    server_name speechmate.site;


    ssl_certificate /etc/letsencrypt/live/speechmate.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/speechmate.site/privkey.pem;

    location / {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # --- response -> 2분(120초)으로 수정 ---
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        # ------------------------------------
    }
}